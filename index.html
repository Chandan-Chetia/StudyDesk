function closeGlobalSearch(){searchOpen=false;$('#search-results')?.classList.remove('show')}
function quick(){const v=$('#q').value.trim();if(!v)return;S.tasks.push({id:uid(),title:v,subject:'',due:'',pri:'med',done:false});save();render()}
function shopRecalc(){let total=0;document.querySelectorAll('.shop-line').forEach(row=>{const fields=row.querySelectorAll('input'),qty=Number(fields[1].value)||0,price=Number(fields[2].value)||0,amount=qty*price;total+=amount;row.querySelector('output').textContent=shopMoney(amount);const item=shopDraft.items.find(x=>x.id===row.dataset.id);if(item){item.name=fields[0].value;item.qty=fields[1].value;item.price=fields[2].value}});const out=$('#shop-total');if(out)out.textContent=shopMoney(total);return total}
function shopAddItem(){shopRecalc();shopDraft.items.push({id:uid(),name:'',qty:'1',price:''});render()}
function shopRemove(id){shopRecalc();shopDraft.items=shopDraft.items.filter(item=>item.id!==id);render()}
function shopNew(){shopDraft={name:'',items:[{id:uid(),name:'',qty:'1',price:''}]};render()}
function shopSave(){shopRecalc();const name=$('#shop-title').value.trim(),items=shopDraft.items.map(item=>({name:item.name.trim(),qty:Number(item.qty),price:Number(item.price)}));if(!name)return toast('Enter a list name');if(!items.length||items.some(item=>!item.name||!Number.isFinite(item.qty)||item.qty<=0||!Number.isFinite(item.price)||item.price<0))return toast('Add each item with a valid quantity and price');const total=items.reduce((sum,item)=>sum+item.qty*item.price,0);S.shopping.push({id:uid(),name,date:new Date().toISOString(),items,total});save();shopNew();toast('Shopping calculation saved')}
function shopLoad(id){const list=S.shopping.find(item=>item.id===id);if(!list)return;shopDraft={name:list.name,items:list.items.map(item=>({id:uid(),...item}))};render();scrollTo(0,0)}
function shopDelete(id){S.shopping=S.shopping.filter(item=>item.id!==id);save();render()}
function addTask(){const v=$('#tt').value.trim();if(!v)return toast('Enter a title');S.tasks.push({id:uid(),title:v,subject:$('#ts').value,due:$('#td').value,pri:$('#tp').value,done:false});save();render()}
function toggle(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;save();if(t.done)toast('Nice work! 🎉');render()}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);if(k==='tt'&&editClassId===id)editClassId=null;save();render()}
function mon(d){cal.m+=d;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}render()}
function noteList(){const q=($('#ns2')?.value||'').toLowerCase();$('#nl').innerHTML=S.notes.filter(n=>(n.title+n.body).toLowerCase().includes(q)).map(n=>`<div class="card" style="margin:0;border-top:4px solid ${col(n.subject)||'var(--bd)'}"><b>${esc(n.title||'Untitled')}</b><div>${tag(n.subject)}</div><div class="note">${esc(n.body)}</div><div class="row"><button class="btn g s" onclick="editNote='${n.id}';render();scrollTo(0,0)">Edit</button><button class="btn g s" onclick="del('notes','${n.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No notes found.</div>'}
function saveNote(){const title=$('#nt').value.trim(),body=$('#nb').value;if(!title&&!body.trim())return toast('Write something first');const d={title,body,subject:$('#ns').value};if(editNote)Object.assign(S.notes.find(x=>x.id===editNote),d);else S.notes.unshift({id:uid(),...d});editNote=null;save();render()}
function addRem(){const t=$('#rt').value.trim(),w=$('#rw').value;if(!t||!w)return toast('Add text and time');S.rem.push({id:uid(),text:t,when:w,fired:false});save();try{Notification.permission==='default'&&Notification.requestPermission()}catch(e){}render()}
function chk(){const n=new Date(),now=ymd(n)+'T'+pad(n.getHours())+':'+pad(n.getMinutes());let c=false;S.rem.forEach(r=>{if(!r.fired&&r.when<=now){r.fired=true;c=true;toast('⏰ '+r.text);try{new Notification('StudyDesk',{body:r.text})}catch(e){}}});if(c){save();if(tab==='cal')render()}}
setInterval(chk,15000);
function addCard(){const q=$('#cq').value.trim(),a=$('#ca').value.trim();if(!q||!a)return toast('Fill question and answer');S.cards.push({id:uid(),q,a,subject:$('#cs').value,k:0});save();render()}
function fcNext(ok){const dk=S.cards.filter(c=>!fc.subj||c.subject===fc.subj),c=dk[fc.i%dk.length];if(ok){c.k=(c.k||0)+1;save()}fc.i++;fc.flip=0;render()}
function addGrade(){const n=$('#gn').value.trim(),v=parseFloat($('#gv').value),m=parseFloat($('#gm').value)||100,s=$('#gs').value;if(!s||!n||isNaN(v))return toast('Pick subject, name and score');S.grades.push({id:uid(),subject:s,name:n,score:v,max:m});save();render()}
function editClass(id){editClassId=id;render()}
function togglePinDay(day){S.pinnedDays=S.pinnedDays.includes(day)?S.pinnedDays.filter(d=>d!==day):[...S.pinnedDays,day];save();render()}
function addClass(){const c={day:+$('#cd').value,start:$('#c1').value,end:$('#c2').value,subject:$('#cs').value,type:$('#ctype').value,room:$('#cr').value.trim(),teacher:$('#cteacher').value.trim()};if(!c.start||!c.end||c.end<=c.start)return toast('End time must be after start time');if(S.tt.some(x=>x.id!==editClassId&&+x.day===c.day&&c.start<x.end&&c.end>x.start))return toast('This time overlaps another class');if(editClassId){Object.assign(S.tt.find(x=>x.id===editClassId),c);editClassId=null}else S.tt.push({id:uid(),...c});save();render()}
const T={f:25,b:5,brk:false,run:false,left:1500,h:null},fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function tUpd(){const e=$('#tm');if(!e)return;e.textContent=fmt(T.left);$('#rg').style.strokeDashoffset=565.5*(1-T.left/((T.brk?T.b:T.f)*60))}
function tSet(){T.f=+$('#fm').value||25;T.b=+$('#bm').value||5;if(!T.run)T.left=(T.brk?T.b:T.f)*60;render()}
function tStart(){if(T.run){clearInterval(T.h);T.run=false}else{T.run=true;T.h=setInterval(()=>{T.left--;if(T.left<=0){if(!T.brk){S.mins[today()]=(S.mins[today()]||0)+T.f;save();toast('Great focus! Take a break ☕')}else toast('Break over — back to it!');T.brk=!T.brk;T.left=(T.brk?T.b:T.f)*60;if(tab==='timer')render()}else tUpd()},1000)}render()}
function tReset(){clearInterval(T.h);T.run=false;T.brk=false;T.left=T.f*60;render()}
function addSub(){const n=$('#sn').value.trim();if(!n)return;S.subjects.push({id:uid(),name:n,color:$('#sc').value});save();render()}
function exp(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S));a.download='studydesk-backup.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign({tt:[],cards:[],grades:[],goal:120,shopping:[]},JSON.parse(r.result));S.shopping=Array.isArray(S.shopping)?S.shopping:[];save();render();toast('Imported')}catch(e){toast('Invalid file')}};r.readAsText(f)}
function wipe(){if(confirm('Delete everything?')){S={subjects:[],tasks:[],notes:[],rem:[],mins:{},tt:[],cards:[],grades:[],goal:120,shopping:[]};save();render()}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const input=$('#global-search');input?.focus();input?.select();if(input)globalSearch(input.value)}if(e.key==='Escape')closeGlobalSearch()});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))closeGlobalSearch()});
render();chk();
</script></body></html>
